# --- Site basics ---
title: stankyHank
name: stankyHank
description: >-
  Security writeups, CVE breakdowns, and notes from the lab.
url: "https://stanky-hank.github.io"
# baseurl stays empty — this is a user site (stanky-hank.github.io)

# --- Theme: Minimal Mistakes (the standard polished Jekyll blog theme) ---
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"   # swap anytime: default, air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise

# --- Plugins (all supported natively by GitHub Pages) ---
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# --- Build / reading ---
markdown: kramdown
paginate: 5
paginate_path: /page:num/

# --- Author (shows in the sidebar next to posts) ---
author:
  name: "stankyHank"
  bio: "Dev turning red-teamer. Security writeups & lab notes."
  # avatar: "/assets/images/avatar.png"   # drop your shepherd avatar at that path and uncomment this
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stanky-hank"

# --- Footer ---
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stanky-hank"

# --- Defaults: auto-apply the nice layout so you never set it per-post ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
